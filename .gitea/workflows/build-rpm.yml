name: Build RPM and Update Repo

on:
  push:
    tags:
      - 'v*'
  # Manual trigger for packaging-only rebuilds (e.g. Release changes)
  workflow_dispatch:

jobs:
  build:
    name: Build Fedora ${{ matrix.release }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: "42"
            image: "rpmbuild-env:fc42"
          - release: "44"
            image: "rpmbuild-env:fc44"
          - release: "45"
            image: "rpmbuild-env:fc45"

    container:
      image: ${{ matrix.image }}
      volumes:
        - /opt/docker/repo/data:/src/rpm

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build RPM
        run: 'rpmdev-setuptree && make dist && rpmbuild -ba slox.spec && rpmbuild -ba slox-all.spec'

      - name: Publish and Update Repository
        env:
          FEDORA_RELEASE: ${{ matrix.release }}
        run: 'set -euo pipefail && DEST="/src/rpm/fedora/${FEDORA_RELEASE}/$(uname -m)" && mkdir -p "$DEST" && find ~/rpmbuild/RPMS/ -name "*.rpm" -exec cp -v {} "$DEST/" \; && createrepo_c --update "$DEST"'
