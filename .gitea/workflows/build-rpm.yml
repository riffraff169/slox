name: Build RPM and Update Repo

on:
  push:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: fedora:44

    steps:
      - name: Install Git and Dependencies
        run: dnf install -y git rpm-build rpmdevtools createrepo_c gobject-introspection-devel glib2-devel gtk4-devel notcurses-devel pcre2-devel postgresql-devel readline-devel sqlite-devel make gcc

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build RPM
        run: |
          rpmdev-setuptree
          make dist
          rpmbuild -ba slox.spec

      - name: Publish and Update Repository
        run: |
          find ~/rpmbuild/RPMS/ -name "*.rpm" -exec cp -v {} /src/rpm/
          cd /src/rpm
          createrepo_c --update .
